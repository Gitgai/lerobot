# R5 row 2 — CONSERVATIVE LoRA on top (drafted 2026-10-22 after row 1's final checkpoint failed the Isaac gate 0/5+0/5).
# Same base, same data, same LoRA targets (rank 16) as row 1. Three deliberate changes, each aimed at forgetting:
#   1. extra_trainable_modules: NO token embeddings, NO layer norms (row 1 trained both → the language/feature statistics
#      of the whole network could drift on 109 episodes of one rig). Keep only the small action/state/time projections.
#   2. lr 2e-5 peak (row 1: 5e-5), cosine to 1e-6 over the run.
#   3. steps 7000 ≈ 1 pass over 55,660 frames at batch 8 (row 1: 25k ≈ 3.6 passes); checkpoints every 1000 so the
#      forgetting curve can be read at 1k/2k/…/7k with the Isaac gate.
# NOT launched until the row-1 checkpoint rows (012500, 005000) have been gated — their result decides whether fewer
# steps alone is enough (then this row may be unnecessary) or the recipe itself must change (then this is it).

policy:
  type: pi05
  pretrained_path: /mnt/data4tb/huggingface-cache/models--dongyoonkim--so101-pi05-base/snapshots/56325bafcca9ec3155b8bfdf655be7df17e7f09f
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true

dataset:
  repo_id: orange89_plus_plate20
  root: /home/kiran/lerobot_assets/datasets/orange89_plus_plate20
  video_backend: pyav
  use_imagenet_stats: false

output_dir: /mnt/data4tb/so101-lora-on-top-20261021/row2_conservative_lora
job_name: r5_row2_conservative_lora
batch_size: 8
grad_accum_steps: 1
steps: 7000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 2.0e-5
  decay_lr: 1.0e-6
  num_decay_steps: 7000

save_checkpoint: true
save_freq: 1000

log_freq: 100
wandb:
  enable: false
  project: vlash
  entity: null
  disable_artifact: true

max_delay_steps: 8

lora:
  enable: true
  backend: peft
  extra_trainable_modules:
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - state_proj
    - state_mlp_in
    - state_mlp_out
  r: 16
  alpha: 16
  dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - fc1
    - fc2
