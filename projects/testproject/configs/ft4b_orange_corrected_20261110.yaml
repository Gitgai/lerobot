# Fine-tune 4b: restart from the frozen fine-tune 3 checkpoint with corrected
# FT4 supervision. The orange task text is identical to the original recording.
# Every entry ends at its natural recorded boundary; no truncated focus entries
# are used because PI05 does not mask its 50-action episode-end padding.

policy:
  type: pi05
  pretrained_path: /home/kiran/lerobot_assets/ckpt_mirror/row3_all169_conservative_010000
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true

dataset:
  repo_id: local/ft4_corrected_train29_20261110
  root: /home/kiran/lerobot_assets/datasets/ft4_corrected_20261110/train29
  video_backend: pyav
  use_imagenet_stats: false

output_dir: /home/kiran/lerobot_assets/training/ft4b_orange_corrected_20261110
job_name: ft4b_orange_corrected_20261110
batch_size: 4
grad_accum_steps: 2
steps: 9000
num_workers: 4
seed: 1110

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 300
  peak_lr: 1.0e-5
  decay_lr: 1.0e-6
  num_decay_steps: 9000

save_checkpoint: true
save_freq: 3000

log_freq: 25
wandb:
  enable: false
  project: vlash
  entity: null
  disable_artifact: true

max_delay_steps: 8

lora:
  enable: true
  backend: peft
  extra_trainable_modules:
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - state_proj
    - state_mlp_in
    - state_mlp_out
  r: 16
  alpha: 16
  dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - fc1
    - fc2
